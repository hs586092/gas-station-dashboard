<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas Station Revenue Optimization Report</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            line-height: 1.6;
            font-variant-numeric: tabular-nums;
        }

        .header {
            background: #000000;
            color: #ffffff;
            padding: 2rem;
            text-align: center;
            border-bottom: 4px solid #000000;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 0.9rem;
            color: #cccccc;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .config-section {
            background: #f8f9fa;
            padding: 2rem;
            border-bottom: 2px solid #e0e0e0;
        }

        .config-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .config-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #333333;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #d0d0d0;
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: monospace;
            background: #ffffff;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #000000;
        }

        .input-group small {
            display: block;
            margin-top: 0.5rem;
            color: #666666;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .btn {
            background: #000000;
            color: #ffffff;
            padding: 1rem 2rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #333333;
        }

        .btn:disabled {
            background: #cccccc;

        }

        .tabs {
            background: #f0f0f0;
            border-bottom: 2px solid #d0d0d0;
            display: flex;
            justify-content: center;

        .tab {
            padding: 1rem 2rem;

            border: none;
            background: transparent;

            text-transform: uppercase;

        }

        .tab:hover {

            background: #e8e8e8;
        }

        .tab.active {
            color: #000000;
            border-bottom-color: #000000;

            max-width: 1400px;

        .report {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        .report.active {

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }

        .section {
            margin-bottom: 3rem;
        }

        .section-header {
            border-bottom: 2px solid #000000;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .section-header h2 {
            font-size: 1.1rem;
            font-weight: 700;

            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;

        }

        .stat-card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            padding: 1.5rem;
        }

        .stat-card.highlight {
            background: #fff7ed;
            border-left: 4px solid #d97706;
        }

        .stat-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;

            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #000000;
            margin-bottom: 0.25rem;
        }

        .stat-card.highlight .stat-value {
            color: #d97706;
        }

        .stat-sub {
            font-size: 0.85rem;
            color: #888888;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            font-size: 0.85rem;
            border: 1px solid #e0e0e0;
        }

        thead {
            background: #f5f5f5;
            border-bottom: 2px solid #d0d0d0;
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-size: 0.75rem;
            color: #333333;
            border-right: 1px solid #e8e8e8;
        }

        th:last-child {
            border-right: none;
        }

        td {
            padding: 0.875rem 1rem;
            border-bottom: 1px solid #f0f0f0;
            border-right: 1px solid #f5f5f5;
        }

        td:last-child {
            border-right: none;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        tbody tr.highlight {
            background: #fffbf0;
            font-weight: 600;
        }

        tbody tr.highlight td {
            color: #d97706;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: #666666;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top-color: #000000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            padding: 1.5rem;
            margin: 2rem 0;
            border-radius: 4px;
            color: #c00;
        }

        .meta-info {
            background: #f8f9fa;
            border: 1px solid #e0e0e0;
            padding: 1rem;
            margin: 2rem 0;
            font-size: 0.85rem;
            color: #666666;
        }

        .equation {
            font-family: 'Courier New', monospace;
            background: #f5f5f5;
            padding: 0.5rem 1rem;
            margin: 0.5rem 0;
            border-left: 3px solid #000000;
            font-size: 0.9rem;
        }

        @media print {
            .header, .tabs, .config-section { 
                break-inside: avoid; 
            }
            .section { 
                break-inside: avoid; 
            }
            .tab:not(.active) { 
                display: none; 
            }
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            table {
                font-size: 0.75rem;
            }
            
            th, td {
                padding: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Gas Station Revenue Optimization Report</h1>
        <p>Statistical Analysis & Pricing Strategy</p>
    </div>

    <div class="config-section">
        <div class="config-container">
            <div class="config-title">📊 Data Source Configuration</div>
            
            <div class="input-group">
                <label>휘발유 데이터 CSV URL</label>
                <input type="text" id="gasUrl" placeholder="Google Sheets 게시된 CSV URL을 입력하세요">
                <small>
                    📝 Google Sheets → 파일 → 공유 → 웹에 게시 → "revenue_gas" 시트 → CSV 형식 선택 → URL 복사
                </small>
            </div>

            <div class="input-group">
                <label>경유 데이터 CSV URL</label>
                <input type="text" id="dieselUrl" placeholder="Google Sheets 게시된 CSV URL을 입력하세요">
                <small>
                    📝 Google Sheets → 파일 → 공유 → 웹에 게시 → "revenue_diesel" 시트 → CSV 형식 선택 → URL 복사
                </small>
            </div>

            <button class="btn" id="loadDataBtn" onclick="loadAllData()">Load Data</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('gas')">휘발유</button>
        <button class="tab" onclick="switchTab('diesel')">경유</button>
    </div>

    <div class="container">
        <div id="gasReport" class="report active">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading data...</p>
            </div>
        </div>

        <div id="dieselReport" class="report">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading data...</p>
            </div>
        </div>
    </div>

    <script>
        function switchTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.report').forEach(r => r.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(type + 'Report').classList.add('active');
        }

        async function loadCSV(url) {
            const response = await fetch(url);
            const text = await response.text();
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                if (values.length === headers.length) {
                    const row = {};
                    headers.forEach((header, idx) => {
                        row[header] = values[idx].trim();
                    });
                    data.push(row);
                }
            }
            return data;
        }

        function analyzeData(data, fuelType) {
            console.log(`Analyzing ${fuelType} data:`, data.length, 'rows');
            
            // 만남의 광장 필터링 및 분석
            const mannamData = [];
            const competitorData = {};
            
            data.forEach(row => {
                const competitor = row['경쟁사'];
                const priceDiff = parseFloat(row['가격 차이']);
                const revenue = parseFloat(row['매출']);
                
                if (isNaN(priceDiff) || isNaN(revenue)) return;
                
                if (competitor === '만남의 광장') {
                    // 만남: -15 ~ +10 범위
                    if (priceDiff >= -15 && priceDiff <= 10) {
                        mannamData.push({priceDiff, revenue});
                    }
                } else {
                    if (!competitorData[competitor]) {
                        competitorData[competitor] = [];
                    }
                    competitorData[competitor].push({priceDiff, revenue});
                }
            });
            
            // 각 경쟁사별 IQR outlier 제거
            const processedData = [...mannamData];
            let outlierCount = 0;
            
            Object.keys(competitorData).forEach(competitor => {
                const compData = competitorData[competitor];
                const revenues = compData.map(d => d.revenue).sort((a, b) => a - b);
                
                const q1 = revenues[Math.floor(revenues.length * 0.25)];
                const q3 = revenues[Math.floor(revenues.length * 0.75)];
                const iqr = q3 - q1;
                const lowerBound = q1 - 1.5 * iqr;
                const upperBound = q3 + 1.5 * iqr;
                
                compData.forEach(d => {
                    if (d.revenue >= lowerBound && d.revenue <= upperBound) {
                        processedData.push(d);
                    } else {
                        outlierCount++;
                    }
                });
            });
            
            console.log(`Processed data: ${processedData.length} points (${outlierCount} outliers removed)`);
            
            // 회귀 분석
            const n = processedData.length;
            const x = processedData.map(d => d.priceDiff);
            const y = processedData.map(d => d.revenue);
            
            // Linear regression
            const sumX = x.reduce((a, b) => a + b, 0);
            const sumY = y.reduce((a, b) => a + b, 0);
            const sumXY = x.reduce((sum, xi, i) => sum + xi * y[i], 0);
            const sumX2 = x.reduce((sum, xi) => sum + xi * xi, 0);
            const sumY2 = y.reduce((sum, yi) => sum + yi * yi, 0);
            
            const meanX = sumX / n;
            const meanY = sumY / n;
            
            const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            const intercept = meanY - slope * meanX;
            
            // R-squared
            const predictions = x.map(xi => slope * xi + intercept);
            const ssTot = y.reduce((sum, yi) => sum + Math.pow(yi - meanY, 2), 0);
            const ssRes = y.reduce((sum, yi, i) => sum + Math.pow(yi - predictions[i], 2), 0);
            const r2 = 1 - (ssRes / ssTot);
            
            // Adjusted R²
            const adjR2 = 1 - ((1 - r2) * (n - 1) / (n - 2));
            
            // Standard error
            const residuals = y.map((yi, i) => yi - predictions[i]);
            const rmse = Math.sqrt(ssRes / n);
            const stdError = Math.sqrt(ssRes / (n - 2));
            
            // Correlation
            const correlation = slope > 0 ? Math.sqrt(r2) : -Math.sqrt(r2);
            
            // F-statistic
            const msReg = (ssTot - ssRes) / 1;
            const msRes = ssRes / (n - 2);
            const fStat = msReg / msRes;
            
            // p-value (approximate)
            const tStat = slope / (stdError / Math.sqrt(sumX2 - sumX * sumX / n));
            
            // Polynomial degree 2
            const poly2 = fitPolynomial(x, y, 2);
            
            // Polynomial degree 3
            const poly3 = fitPolynomial(x, y, 3);
            
            // 최적 가격 찾기 (linear 기준)
            const optimalPrice = -intercept / slope;
            const maxRevenue = slope * optimalPrice + intercept;
            
            // 신뢰구간 (95%)
            const ciMargin = 1.96 * stdError;
            const ciLower = maxRevenue - ciMargin;
            const ciUpper = maxRevenue + ciMargin;
            
            // 잔차 분석
            const residualMean = residuals.reduce((a, b) => a + b, 0) / n;
            const residualStd = Math.sqrt(residuals.reduce((sum, r) => sum + Math.pow(r - residualMean, 2), 0) / n);
            const skewness = calculateSkewness(residuals);
            const kurtosis = calculateKurtosis(residuals);
            
            // Durbin-Watson
            const dw = calculateDurbinWatson(residuals);
            
            // Elasticity
            const elasticity = slope * (meanX / meanY);
            
            return {
                n,
                outlierCount,
                optimalPrice,
                maxRevenue,
                slope,
                intercept,
                r2,
                adjR2,
                rmse,
                stdError,
                correlation,
                fStat,
                tStat,
                ciLower,
                ciUpper,
                ciMargin,
                residualMean,
                residualStd,
                skewness,
                kurtosis,
                dw,
                elasticity,
                poly2,
                poly3
            };
        }
        
        function fitPolynomial(x, y, degree) {
            const n = x.length;
            
            // Create design matrix
            const X = [];
            for (let i = 0; i < n; i++) {
                const row = [];
                for (let d = 0; d <= degree; d++) {
                    row.push(Math.pow(x[i], d));
                }
                X.push(row);
            }
            
            // Normal equations: (X^T X) β = X^T y
            const XtX = multiplyMatrices(transpose(X), X);
            const Xty = multiplyMatrixVector(transpose(X), y);
            
            // Solve using Gaussian elimination
            const coeffs = gaussianElimination(XtX, Xty);
            
            // Calculate R²
            const predictions = x.map((xi, i) => {
                let pred = 0;
                for (let d = 0; d <= degree; d++) {
                    pred += coeffs[d] * Math.pow(xi, d);
                }
                return pred;
            });
            
            const meanY = y.reduce((a, b) => a + b, 0) / n;
            const ssTot = y.reduce((sum, yi) => sum + Math.pow(yi - meanY, 2), 0);
            const ssRes = y.reduce((sum, yi, i) => sum + Math.pow(yi - predictions[i], 2), 0);
            const r2 = 1 - (ssRes / ssTot);
            const adjR2 = 1 - ((1 - r2) * (n - 1) / (n - degree - 1));
            const rmse = Math.sqrt(ssRes / n);
            
            return {coeffs, r2, adjR2, rmse};
        }
        
        function transpose(matrix) {
            return matrix[0].map((_, i) => matrix.map(row => row[i]));
        }
        
        function multiplyMatrices(a, b) {
            const result = [];
            for (let i = 0; i < a.length; i++) {
                result[i] = [];
                for (let j = 0; j < b[0].length; j++) {
                    let sum = 0;
                    for (let k = 0; k < a[0].length; k++) {
                        sum += a[i][k] * b[k][j];
                    }
                    result[i][j] = sum;
                }
            }
            return result;
        }
        
        function multiplyMatrixVector(matrix, vector) {
            return matrix.map(row => 
                row.reduce((sum, val, i) => sum + val * vector[i], 0)
            );
        }
        
        function gaussianElimination(A, b) {
            const n = A.length;
            const aug = A.map((row, i) => [...row, b[i]]);
            
            // Forward elimination
            for (let i = 0; i < n; i++) {
                // Partial pivoting
                let maxRow = i;
                for (let k = i + 1; k < n; k++) {
                    if (Math.abs(aug[k][i]) > Math.abs(aug[maxRow][i])) {
                        maxRow = k;
                    }
                }
                [aug[i], aug[maxRow]] = [aug[maxRow], aug[i]];
                
                // Eliminate column
                for (let k = i + 1; k < n; k++) {
                    const factor = aug[k][i] / aug[i][i];
                    for (let j = i; j <= n; j++) {
                        aug[k][j] -= factor * aug[i][j];
                    }
                }
            }
            
            // Back substitution
            const x = new Array(n);
            for (let i = n - 1; i >= 0; i--) {
                x[i] = aug[i][n];
                for (let j = i + 1; j < n; j++) {
                    x[i] -= aug[i][j] * x[j];
                }
                x[i] /= aug[i][i];
            }
            
            return x;
        }
        
        function calculateSkewness(values) {
            const n = values.length;
            const mean = values.reduce((a, b) => a + b, 0) / n;
            const std = Math.sqrt(values.reduce((sum, v) => sum + Math.pow(v - mean, 2), 0) / n);
            const skew = values.reduce((sum, v) => sum + Math.pow((v - mean) / std, 3), 0) / n;
            return skew;
        }
        
        function calculateKurtosis(values) {
            const n = values.length;
            const mean = values.reduce((a, b) => a + b, 0) / n;
            const std = Math.sqrt(values.reduce((sum, v) => sum + Math.pow(v - mean, 2), 0) / n);
            const kurt = values.reduce((sum, v) => sum + Math.pow((v - mean) / std, 4), 0) / n;
            return kurt - 3; // Excess kurtosis
        }
        
        function calculateDurbinWatson(residuals) {
            let sumDiff = 0;
            let sumSquared = 0;
            
            for (let i = 1; i < residuals.length; i++) {
                sumDiff += Math.pow(residuals[i] - residuals[i-1], 2);
            }
            
            for (let i = 0; i < residuals.length; i++) {
                sumSquared += Math.pow(residuals[i], 2);
            }
            
            return sumDiff / sumSquared;
        }
        
        function generateReport(analysis, fuelType) {
            return `
                <div class="meta-info">
                    <strong>Report Generated:</strong> ${new Date().toLocaleString('ko-KR')} | 
                    <strong>Fuel Type:</strong> ${fuelType === 'gas' ? '휘발유' : '경유'} | 
                    <strong>Data Points:</strong> ${analysis.n} | 
                    <strong>Outliers Removed:</strong> ${analysis.outlierCount}
                </div>

                <div class="section">
                    <div class="section-header">
                        <h2>I. Executive Summary</h2>
                    </div>
                    <div class="grid">
                        <div class="stat-card highlight">
                            <div class="stat-label">Optimal Price Difference</div>
                            <div class="stat-value">${analysis.optimalPrice.toFixed(2)}원</div>
                            <div class="stat-sub">Compared to competitors</div>
                        </div>
                        <div class="stat-card highlight">
                            <div class="stat-label">Maximum Expected Revenue</div>
                            <div class="stat-value">₩${analysis.maxRevenue.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</div>
                            <div class="stat-sub">At optimal price point</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Correlation Coefficient</div>
                            <div class="stat-value">${analysis.correlation.toFixed(4)}</div>
                            <div class="stat-sub">${Math.abs(analysis.correlation) > 0.7 ? 'Strong' : Math.abs(analysis.correlation) > 0.4 ? 'Moderate' : 'Weak'} ${analysis.correlation > 0 ? 'positive' : 'negative'} correlation</div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">
                        <h2>II. Regression Model Comparison</h2>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Model</th>
                                <th>R²</th>
                                <th>Adj. R²</th>
                                <th>RMSE</th>
                                <th>Equation</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="highlight">
                                <td><strong>Linear</strong></td>
                                <td>${analysis.r2.toFixed(4)}</td>
                                <td>${analysis.adjR2.toFixed(4)}</td>
                                <td>₩${analysis.rmse.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</td>
                                <td>y = ${analysis.slope.toFixed(2)}x + ${analysis.intercept.toFixed(2)}</td>
                            </tr>
                            <tr>
                                <td><strong>Polynomial (deg 2)</strong></td>
                                <td>${analysis.poly2.r2.toFixed(4)}</td>
                                <td>${analysis.poly2.adjR2.toFixed(4)}</td>
                                <td>₩${analysis.poly2.rmse.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</td>
                                <td>y = ${analysis.poly2.coeffs[2].toFixed(2)}x² + ${analysis.poly2.coeffs[1].toFixed(2)}x + ${analysis.poly2.coeffs[0].toFixed(2)}</td>
                            </tr>
                            <tr>
                                <td><strong>Polynomial (deg 3)</strong></td>
                                <td>${analysis.poly3.r2.toFixed(4)}</td>
                                <td>${analysis.poly3.adjR2.toFixed(4)}</td>
                                <td>₩${analysis.poly3.rmse.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</td>
                                <td>y = ${analysis.poly3.coeffs[3].toFixed(2)}x³ + ${analysis.poly3.coeffs[2].toFixed(2)}x² + ${analysis.poly3.coeffs[1].toFixed(2)}x + ${analysis.poly3.coeffs[0].toFixed(2)}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="section">
                    <div class="section-header">
                        <h2>III. Statistical Diagnostics</h2>
                    </div>
                    <div class="grid">
                        <div class="stat-card">
                            <div class="stat-label">F-Statistic</div>
                            <div class="stat-value">${analysis.fStat.toFixed(2)}</div>
                            <div class="stat-sub">Model significance</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">t-Statistic</div>
                            <div class="stat-value">${analysis.tStat.toFixed(4)}</div>
                            <div class="stat-sub">Coefficient significance</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Standard Error</div>
                            <div class="stat-value">₩${analysis.stdError.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</div>
                            <div class="stat-sub">Prediction uncertainty</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Durbin-Watson</div>
                            <div class="stat-value">${analysis.dw.toFixed(4)}</div>
                            <div class="stat-sub">Autocorrelation test (target: ~2.0)</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Price Elasticity</div>
                            <div class="stat-value">${analysis.elasticity.toFixed(4)}</div>
                            <div class="stat-sub">${Math.abs(analysis.elasticity) > 1 ? 'Elastic' : 'Inelastic'} demand</div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">
                        <h2>IV. Confidence Interval Analysis (95%)</h2>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Metric</th>
                                <th>Value</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Point Estimate (Maximum Revenue)</td>
                                <td>₩${analysis.maxRevenue.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</td>
                            </tr>
                            <tr>
                                <td>Lower Bound (95% CI)</td>
                                <td>₩${analysis.ciLower.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</td>
                            </tr>
                            <tr>
                                <td>Upper Bound (95% CI)</td>
                                <td>₩${analysis.ciUpper.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</td>
                            </tr>
                            <tr>
                                <td>Margin of Error</td>
                                <td>±₩${analysis.ciMargin.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="section">
                    <div class="section-header">
                        <h2>V. Residual Analysis</h2>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Statistic</th>
                                <th>Value</th>
                                <th>Interpretation</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Residual Mean</td>
                                <td>${analysis.residualMean.toFixed(4)}</td>
                                <td>${Math.abs(analysis.residualMean) < 100 ? 'Good (near zero)' : 'Check for bias'}</td>
                            </tr>
                            <tr>
                                <td>Residual Std Dev</td>
                                <td>₩${analysis.residualStd.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</td>
                                <td>Prediction variability</td>
                            </tr>
                            <tr>
                                <td>Skewness</td>
                                <td>${analysis.skewness.toFixed(4)}</td>
                                <td>${Math.abs(analysis.skewness) < 0.5 ? 'Symmetric' : Math.abs(analysis.skewness) < 1 ? 'Moderately skewed' : 'Highly skewed'}</td>
                            </tr>
                            <tr>
                                <td>Excess Kurtosis</td>
                                <td>${analysis.kurtosis.toFixed(4)}</td>
                                <td>${Math.abs(analysis.kurtosis) < 0.5 ? 'Normal' : analysis.kurtosis > 0 ? 'Heavy-tailed' : 'Light-tailed'}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="section">
                    <div class="section-header">
                        <h2>VI. Methodology</h2>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>Component</th>
                                <th>Method</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Outlier Detection (만남의 광장)</td>
                                <td>Custom range: -15 to +10 KRW</td>
                            </tr>
                            <tr>
                                <td>Outlier Detection (Other Competitors)</td>
                                <td>IQR method (1.5 × IQR)</td>
                            </tr>
                            <tr>
                                <td>Regression Models</td>
                                <td>Linear, 2nd degree polynomial, 3rd degree polynomial</td>
                            </tr>
                            <tr>
                                <td>Confidence Interval</td>
                                <td>95% level (z = 1.96)</td>
                            </tr>
                            <tr>
                                <td>Sample Size</td>
                                <td>${analysis.n} observations (${analysis.outlierCount} outliers removed)</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
        }

        async function loadAllData() {
            const gasUrl = document.getElementById('gasUrl').value.trim();
            const dieselUrl = document.getElementById('dieselUrl').value.trim();
            
            const loadBtn = document.getElementById('loadDataBtn');
            loadBtn.disabled = true;
            loadBtn.textContent = 'Loading...';
            
            try {
                // Load gas data
                if (gasUrl) {
                    console.log('Loading gas data from:', gasUrl);
                    const gasData = await loadCSV(gasUrl);
                    const gasAnalysis = analyzeData(gasData, 'gas');
                    document.getElementById('gasReport').innerHTML = generateReport(gasAnalysis, 'gas');
                    console.log('Gas data loaded successfully');
                }
                
                // Load diesel data
                if (dieselUrl) {
                    console.log('Loading diesel data from:', dieselUrl);
                    const dieselData = await loadCSV(dieselUrl);
                    const dieselAnalysis = analyzeData(dieselData, 'diesel');
                    document.getElementById('dieselReport').innerHTML = generateReport(dieselAnalysis, 'diesel');
                    console.log('Diesel data loaded successfully');
                }
                
                loadBtn.textContent = '✓ Data Loaded Successfully';
                setTimeout(() => {
                    loadBtn.textContent = 'Reload Data';
                    loadBtn.disabled = false;
                }, 2000);
                
            } catch (error) {
                console.error('Error loading data:', error);
                const errorMsg = `
                    <div class="error">
                        <strong>Error loading data:</strong> ${error.message}<br><br>
                        Please check:<br>
                        1. CSV URL is correct and publicly accessible<br>
                        2. Google Sheets is published to web<br>
                        3. URL format: https://docs.google.com/spreadsheets/d/.../export?format=csv&gid=...
                    </div>
                `;
                
                if (gasUrl) document.getElementById('gasReport').innerHTML = errorMsg;
                if (dieselUrl) document.getElementById('dieselReport').innerHTML = errorMsg;
                
                loadBtn.textContent = 'Try Again';
                loadBtn.disabled = false;
            }
        }
        
        // Auto-load if URLs are in localStorage
        window.addEventListener('load', () => {
            const savedGasUrl = localStorage.getItem('gasUrl');
            const savedDieselUrl = localStorage.getItem('dieselUrl');
            
            if (savedGasUrl) document.getElementById('gasUrl').value = savedGasUrl;
            if (savedDieselUrl) document.getElementById('dieselUrl').value = savedDieselUrl;
            
            // Save URLs on input
            document.getElementById('gasUrl').addEventListener('change', (e) => {
                localStorage.setItem('gasUrl', e.target.value);
            });
            document.getElementById('dieselUrl').addEventListener('change', (e) => {
                localStorage.setItem('dieselUrl', e.target.value);
            });
        });
    </script>
</body>
</html>
